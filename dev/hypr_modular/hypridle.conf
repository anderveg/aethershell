general {
    lock_cmd = pidof hyprlock || hyprlock --immediate-render --no-fade-in   # Verrouille sans doublon
    # Coupe l'écran de veille avant la mise en veille pour ne pas le retrouver au réveil
    before_sleep_cmd = sh -c "$HOME/.config/quickshell/core/as-core matrix --stop"
    # Sur NVIDIA, verrouiller *après* nvidia-resume + dpms("on") évite que la surface ext-session-lock reste figée en noir au réveil
    after_sleep_cmd = hyprctl eval 'hl.dsp.dpms("on")' && sleep 0.6 && loginctl lock-session
    # Permet à Jellyfin/Navigateurs de bloquer la mise en veille pendant la lecture
    ignore_dbus_inhibit = false 
}

# 0. ÉCRAN DE VEILLE TERMINAL
listener {
    timeout = 900
    on-timeout = sh -c "$HOME/.config/quickshell/core/as-core matrix --ss"
    on-resume = sh -c "$HOME/.config/quickshell/core/as-core matrix --stop"
}

# 1. ÉCONOMISEUR D'ÉCRAN OLED (20 minutes = 1200 secondes, après l'écran de veille)
listener {
    timeout = 1200
    on-timeout = hyprctl eval 'hl.dsp.dpms("off")'
    on-resume = hyprctl eval 'hl.dsp.dpms("on")'
}

# 2. MISE EN VEILLE DU SYSTÈME (1 heure = 3600 secondes)
listener {
    timeout = 3600
    on-timeout = sh -c "$HOME/.config/quickshell/core/as-core matrix --stop; systemctl suspend"
}
